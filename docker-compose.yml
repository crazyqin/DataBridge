services:
  databridge:
    image: databridge:1.4.0
    build:
      context: .
      args:
        DATABRIDGE_VERSION: 1.4.0
        DATABRIDGE_BUILD_COMMIT: ${DATABRIDGE_BUILD_COMMIT:-unknown}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATASKILL_STUDIO_URL: ${DATASKILL_STUDIO_URL:-}
      DATASKILL_SERVICE_TOKEN: ${DATASKILL_SERVICE_TOKEN:-}
      DATASKILL_AUTH_CONNECTION_ID: ${DATASKILL_AUTH_CONNECTION_ID:-}
      DATASKILL_STAFF_BINDING: ${DATASKILL_STAFF_BINDING:-_auth_staff_code}
      DATASKILL_IDENTITY_PROVIDER: ${DATASKILL_IDENTITY_PROVIDER:-uap}
    volumes:
      - databridge_data:/data
volumes:
  databridge_data:
