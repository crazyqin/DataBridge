services:
  databridge:
    image: databridge:1.4.1
    build:
      context: .
      args:
        DATABRIDGE_VERSION: 1.4.1
        DATABRIDGE_BUILD_COMMIT: ${DATABRIDGE_BUILD_COMMIT:-unknown}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - databridge_data:/data
volumes:
  databridge_data:
